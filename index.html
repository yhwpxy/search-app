<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>升级版内容搜索器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🔍 内容搜索器</h1>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="输入关键词搜索（例如：HTML、Git、部署）">
            <button id="searchBtn">搜索</button>
        </div>
        <div class="info" id="info"></div>
        <div class="result-area" id="resultArea"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
